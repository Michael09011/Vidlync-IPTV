<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Vidlync</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <style>
      :root{
        --bg:#0a0e14; --card:#151b25; --muted:#9ca3af;
        --card-hover:#1c2432; --primary:#2563eb; --primary-hover:#3b74f3; --accent:#1b2330;
        --text-primary:#f1f5f9; --text-muted:#94a3b8; --border:#262f3d; --success:#10b981;
        --danger:#ef4444; --star:#fbbf24;
        --radius-sm:6px; --radius-md:10px; --radius-lg:14px;
        --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
        --shadow-md:0 8px 24px rgba(0,0,0,0.35);
        --shadow-lg:0 16px 40px rgba(0,0,0,0.45);
      }
      *{ box-sizing:border-box; }
      html,body{height:100%;margin:0;}
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
        background:var(--bg); color:var(--text-primary);
        -webkit-font-smoothing:antialiased;
      }
      header {
        padding:10px 20px; background:linear-gradient(180deg,#121823,var(--bg));
        display:flex; align-items:center; gap:10px;
        box-shadow:var(--shadow-sm); border-bottom:1px solid var(--border);
      }
      header .brand-icon{
        width:30px;height:30px;border-radius:8px;flex-shrink:0;
        box-shadow:0 2px 8px rgba(37,99,235,0.35);
      }
      header .brand-name{ font-size:15px; font-weight:700; letter-spacing:0.2px; color:var(--text-primary); }
      header .brand-name small{ display:block; font-size:10px; font-weight:500; color:var(--text-muted); letter-spacing:0.3px; margin-top:1px; }
      header .toolbar{ display:flex; align-items:center; gap:6px; }
      header .toolbar::before{ content:''; width:1px; height:22px; background:var(--border); margin-right:6px; }
      #favoritesBtn::before{ content:'⭐ '; }
      #openUrlBtn::before{ content:'🔗 '; }
      #settingsBtn::before{ content:'⚙️ '; }
      #root { display:grid; grid-template-columns:280px 1fr; gap:0; height:calc(100% - 52px); min-height:600px; background:var(--bg); }
      .left-col { background:var(--card); border-right:1px solid var(--border); overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; }
      .left-col input, .left-col select { background:var(--bg); border:1px solid var(--border); color:var(--text-primary); margin-bottom:4px; }
      .left-col button { background:var(--accent); color:var(--text-primary); border:1px solid var(--border); }
      .left-col button:hover { background:var(--card-hover); }
      .left-col button.primary { background:var(--primary); border:none; }
      /* Sidebar collapse button – same appearance as header buttons */
      #sidebarToggle {
        position: absolute;
        left: 12px;
        top: 12px;
        padding: 8px 12px;
        background: var(--accent);
        border: none;
        color: var(--text-primary);
        border-radius: var(--radius-sm);
        cursor: pointer;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
      }
      #sidebarToggle:hover { background:var(--card-hover); }
      .player { background:#000; padding:0; overflow:hidden; height:100%; }
      .player video { border-radius:0; background:#000; width:100%; height:100%; object-fit:contain; }
      /* Playlist section titles */
      .left-col strong {
        color:var(--text-muted); display:block; margin-top:10px; margin-bottom:8px;
        font-size:11px; text-transform:uppercase; letter-spacing:0.8px; font-weight:700;
        padding-left:9px; border-left:2px solid var(--primary);
      }
      /* generic list-item card used for playlists / favorites */
      .list-item{
        padding:10px; border-radius:var(--radius-md); background:var(--accent);
        border:1px solid transparent; cursor:pointer; font-size:12px;
        transition:background .15s ease, transform .15s ease, border-color .15s ease;
      }
      .list-item:hover{ background:var(--card-hover); border-color:var(--border); transform:translateX(2px); }
      /* channel list items - compact */
      .channel { padding:9px; border-radius:var(--radius-md); cursor:pointer; display:flex; align-items:center; gap:10px; transition:background .15s ease, transform .1s ease; border:1px solid transparent; border-left:2px solid transparent; }
      .channel:hover { background:var(--card-hover); transform:translateX(1px); }
      .channel.active { background:var(--card-hover); border-left:2px solid var(--primary); }
      .channel img { width:42px; height:30px; object-fit:cover; border-radius:var(--radius-sm); background:#000; flex-shrink:0; box-shadow:var(--shadow-sm); }
      .channel > div { flex:1; min-width:0; }
      .channel .title{ font-size:13px; font-weight:600; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .channel .title mark{ background:rgba(37,99,235,0.35); color:inherit; border-radius:3px; padding:0 1px; }
      .channel .meta{ font-size:11px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      /* inputs & buttons */
      button {
        padding:8px 12px; border-radius:var(--radius-sm); border:none;
        background:var(--accent); color:var(--text-primary); cursor:pointer;
        transition:background .15s ease, transform .15s ease, box-shadow .15s ease;
        font-size:12px; font-weight:500;
      }
      button.primary{ background:linear-gradient(135deg,var(--primary),#1d4ed8); box-shadow:0 4px 14px rgba(37,99,235,0.35) }
      button:hover:not(:disabled){ background:var(--card-hover); transform:translateY(-1px); }
      button.primary:hover{ background:linear-gradient(135deg,var(--primary-hover),#2563eb); box-shadow:0 6px 18px rgba(37,99,235,0.45); }
      button:active:not(:disabled){ transform:translateY(0); }
      button:disabled{ opacity:0.5; cursor:not-allowed; transform:none; }
      input, select {
        padding:8px 10px; border-radius:var(--radius-sm); border:1px solid var(--border);
        background:var(--bg); color:var(--text-primary); font-size:12px;
        transition:border-color .15s ease, box-shadow .15s ease;
      }
      input:focus, select:focus{ outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,0.2); }
      input::placeholder { color:var(--text-muted); }
      .drag-handle { padding:4px 6px; background:var(--accent); border-radius:4px; color:var(--text-muted); cursor:grab; user-select:none; }
      .drag-handle:active { cursor:grabbing; }
      .sortable-ghost { opacity: 0.5; }
      #playerStatus { margin-top:8px; padding:8px 12px; border-radius:var(--radius-sm); background:var(--card); font-size:12px; }
      #epg { margin-top:8px; padding:8px 12px; border-radius:var(--radius-sm); background:var(--card); font-size:11px; color:var(--text-muted); }
      /* position to top center instead of anchored to bottom */
      #toastContainer { position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:10002; width:auto; max-width:80%; display:flex; flex-direction:column; align-items:center; }

      /* Toast styling */
      @keyframes toastIn{ from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:translateY(0); } }
      #toastContainer > div {
        background:var(--card); color:var(--text-primary); padding:10px 14px; border-radius:var(--radius-sm);
        border-left:3px solid var(--primary); box-shadow:var(--shadow-md); margin-bottom:8px;
        animation:toastIn .18s ease;
      }
      /* Responsive - stack on small screens */
      @media (max-width:768px){
        #root { grid-template-columns:1fr; }
        .left-col { max-height:40vh; border-right:none; border-bottom:1px solid var(--border); }
        .player { min-height:60vh; }
        .left-col { padding:8px; }
      }
      /* Modal */
      @keyframes modalIn{ from{ opacity:0; transform:scale(.97) translateY(4px); } to{ opacity:1; transform:scale(1) translateY(0); } }
      .modal-overlay{
        position:fixed; left:0; top:0; right:0; bottom:0; z-index:10000;
        display:flex; align-items:center; justify-content:center;
        background:rgba(5,8,13,0.65); backdrop-filter:blur(3px);
      }
      .modal-box{
        background:var(--card); padding:20px; border-radius:var(--radius-lg);
        border:1px solid var(--border); box-shadow:var(--shadow-lg);
        animation:modalIn .16s ease;
      }
      .modal-box h3{ margin:0 0 14px 0; font-size:15px; font-weight:700; }
      /* Scrollbar styling */
      ::-webkit-scrollbar { width:7px; height:7px; }
      ::-webkit-scrollbar-track { background:transparent; }
      ::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
      ::-webkit-scrollbar-thumb:hover { background:#3a4555; }
    </style>
  </head>
  <body>
    <header>
      <img class="brand-icon" src="../assets/icon.svg" alt="" aria-hidden="true">
      <div class="brand-name">Vidlync<small>IPTV Player</small></div>
      <div style="flex:1"></div>
      <div class="toolbar">
        <button id="favoritesBtn">즐겨찾기</button>
        <button id="openUrlBtn">URL 불러오기</button>
        <button id="settingsBtn">설정</button>
        <button id="openBtn" class="primary">+ 플레이리스트 추가</button>
      </div>
    </header>
    <div id="root"></div>
    <script src="../node_modules/hls.js/dist/hls.min.js"></script>
    <script src="./mpv-adapter.js"></script>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
